- id: gitea-push
  execute-command: /bin/echo
  response-message: accepted gitea push
  include-command-output-in-response: true
  pass-arguments-to-command:
    - source: string
      name: accepted
  http-methods: [POST]
  trigger-rule-mismatch-http-response-code: 401
  trigger-rule:
    and:
      - match:
          type: payload-hmac-sha256
          secret: "{{ getenvRequired "GITEA_WEBHOOK_SECRET" | js }}"
          parameter:
            source: header
            name: X-Gitea-Signature
      - match:
          type: value
          value: push
          parameter:
            source: header
            name: X-Gitea-Event
