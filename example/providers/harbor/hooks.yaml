- id: harbor-push
  execute-command: /bin/echo
  response-message: accepted harbor artifact push
  include-command-output-in-response: true
  pass-arguments-to-command:
    - source: string
      name: accepted
  http-methods: [POST]
  trigger-rule-mismatch-http-response-code: 401
  trigger-rule:
    and:
      - match:
          type: value
          value: "{{ printf "Bearer %s" (getenv "HARBOR_WEBHOOK_TOKEN") | js }}"
          parameter:
            source: header
            name: Authorization
      - match:
          type: value
          value: PUSH_ARTIFACT
          parameter:
            source: payload
            name: type
