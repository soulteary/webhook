- id: alertmanager-firing
  execute-command: /bin/echo
  response-message: accepted firing alerts
  include-command-output-in-response: true
  pass-arguments-to-command:
    - source: string
      name: accepted
  http-methods: [POST]
  trigger-rule-mismatch-http-response-code: 401
  trigger-rule:
    and:
      - match:
          type: value
          value: 'Bearer {{ getenv "ALERTMANAGER_WEBHOOK_TOKEN" }}'
          parameter:
            source: header
            name: Authorization
      - match:
          type: value
          value: firing
          parameter:
            source: payload
            name: status
