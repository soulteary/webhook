- id: github-push
  execute-command: /bin/echo
  response-message: accepted github push
  include-command-output-in-response: true
  pass-arguments-to-command:
    - source: string
      name: accepted
  http-methods: [POST]
  trigger-rule-mismatch-http-response-code: 401
  trigger-rule:
    and:
      - match:
          type: payload-hmac-sha256
          secret: "{{ getenv "GITHUB_WEBHOOK_SECRET" | js }}"
          parameter:
            source: header
            name: X-Hub-Signature-256
      - match:
          type: value
          value: push
          parameter:
            source: header
            name: X-GitHub-Event
