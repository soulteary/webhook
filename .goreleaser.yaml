version: 2
project_name: webhook

builds:
  - <<: &build_defaults
      env:
        - CGO_ENABLED=0
      ldflags:
        - >-
          -w -s
          -X "github.com/soulteary/webhook/internal/version.Version={{ .Tag }}"
          -X "github.com/soulteary/webhook/internal/version.Commit={{ .FullCommit }}"
          -X "github.com/soulteary/webhook/internal/version.BuildDate={{ .Date }}"
          -X "github.com/soulteary/webhook/internal/version.Branch={{ .Branch }}"
    id: macos
    goos: [darwin]
    goarch: [amd64, arm64]

  - <<: *build_defaults
    id: linux
    goos: [linux]
    goarch: ["386", arm, amd64, arm64]
    goarm:
      - "7"
      - "6"

dockers:
  - image_templates:
      - "soulteary/webhook:linux-amd64-{{ .Tag }}"
      - "soulteary/webhook:linux-amd64"
      - "ghcr.io/soulteary/webhook:linux-amd64-{{ .Tag }}"
      - "ghcr.io/soulteary/webhook:linux-amd64"
    dockerfile: docker/goreleaser/Dockerfile.core
    ids: [linux]
    use: buildx
    goarch: amd64
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description={{ .ProjectName }}"
      - "--label=org.opencontainers.image.url=https://github.com/soulteary/webhook"
      - "--label=org.opencontainers.image.source=https://github.com/soulteary/webhook"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"

  - image_templates:
      - "soulteary/webhook:linux-arm64-{{ .Tag }}"
      - "soulteary/webhook:linux-arm64"
      - "ghcr.io/soulteary/webhook:linux-arm64-{{ .Tag }}"
      - "ghcr.io/soulteary/webhook:linux-arm64"
    dockerfile: docker/goreleaser/Dockerfile.core
    ids: [linux]
    use: buildx
    goos: linux
    goarch: arm64
    goarm: ""
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description={{ .ProjectName }}"
      - "--label=org.opencontainers.image.url=https://github.com/soulteary/webhook"
      - "--label=org.opencontainers.image.source=https://github.com/soulteary/webhook"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"

  - image_templates:
      - "soulteary/webhook:linux-armv7-{{ .Tag }}"
      - "soulteary/webhook:linux-armv7"
      - "ghcr.io/soulteary/webhook:linux-armv7-{{ .Tag }}"
      - "ghcr.io/soulteary/webhook:linux-armv7"
    dockerfile: docker/goreleaser/Dockerfile.core
    ids: [linux]
    use: buildx
    goos: linux
    goarch: arm
    goarm: "7"
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm/v7"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description={{ .ProjectName }}"
      - "--label=org.opencontainers.image.url=https://github.com/soulteary/webhook"
      - "--label=org.opencontainers.image.source=https://github.com/soulteary/webhook"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"

  - image_templates:
      - "soulteary/webhook:linux-armv6-{{ .Tag }}"
      - "soulteary/webhook:linux-armv6"
      - "ghcr.io/soulteary/webhook:linux-armv6-{{ .Tag }}"
