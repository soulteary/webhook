name: Release

on:
  push:
    tags:
      - "*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO111MODULE: on
  DOCKER_CLI_EXPERIMENTAL: "enabled"

permissions:
  contents: read

jobs:
  preflight:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate release ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be a stable semantic version such as 7.3.0" >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          if release_response="$(gh api \
            --method GET \
            --include \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            2>&1)"; then
            echo "release ${GITHUB_REF_NAME} already exists; refusing to publish it again" >&2
            exit 1
          elif ! grep -Eq '^HTTP/[0-9.]+ 404 ' <<<"$release_response"; then
            echo "could not confirm that release ${GITHUB_REF_NAME} is unused" >&2
            printf '%s\n' "$release_response" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Tests
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -race ./...

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Validate documentation
        run: |
          python -m pip install --disable-pip-version-check -r requirements-docs.txt
          mkdocs build --strict

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.18.0
          args: check

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.51.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attest:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir dist

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*_checksums.txt
            dist/*.sbom.json

  verify:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir dist

      - name: Verify release assets and signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$(find dist -maxdepth 1 -name 'webhook_*_linux_amd64.tar.gz' -print -quit)"
          test -n "$archive"
          test -f "dist/webhook_${GITHUB_REF_NAME}_checksums.txt"
          test -f "dist/webhook_${GITHUB_REF_NAME}_checksums.txt.sigstore.json"
          test -n "$(find dist -maxdepth 1 -name '*.sbom.json' -print -quit)"
          cosign verify-blob \
            --bundle "dist/webhook_${GITHUB_REF_NAME}_checksums.txt.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "dist/webhook_${GITHUB_REF_NAME}_checksums.txt"
          gh attestation verify "$archive" -R "$GITHUB_REPOSITORY"

      - name: Verify published container variants
        run: |
          for variant in core runner extended; do
            image="ghcr.io/${GITHUB_REPOSITORY}:${variant}-${GITHUB_REF_NAME}"
            docker pull "$image"
            test "$(docker image inspect --format '{{ .Config.User }}' "$image")" = "65532:65532"
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$image"
          done

  documentation:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Configure Git identity
        run: git config user.name github-actions && git config user.email github-actions@github.com

      - name: Deploy release documentation
        run: mike deploy --push --update-aliases "${GITHUB_REF_NAME}" latest && mike set-default --push latest
