name: Tests

on:
  workflow_dispatch:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: go test -race ./...

        if: "!(github.event_name == 'pull_request')"
      - name: Remove stale generated report evidence
        id: report_cleanup
        if: "!cancelled() && (github.event_name == 'pull_request')"
        shell: bash
        run: |
          set -euo pipefail
          test ! -L .github
          rm -f -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
          rm -rf -- .github/test-results
      - name: Test, race and coverage (GTR v1.1.3)
        id: go_test_report
        uses: soulteary/go-test-report-action@2760569379a1c95a195c602872ba00cd61495d89 # v1.1.3
        with:
          directory: "."
          packages: "./..."
          race: "true"
          coverage_threshold: "0"
          test_args: "-count=1"
          version: "v1.1.3"
          cover_mode: "atomic"
          commit: "false"
        if: github.event_name == 'pull_request'
      - name: Go quality report (v1.1.7)
        if: "!cancelled() && (github.event_name == 'pull_request') && steps.report_cleanup.outcome == 'success'"
        id: go_report_card
        uses: soulteary/goreportcard-action@9744d0297ca0116cd4ef83e4ff6f3ba42a65a24d # v1.1.7
        with:
          directory: "."
          version: "v1.1.7"
          threshold: "0"
          report: "true"
          commit: "false"
      - name: Restore project Go toolchain
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Reuse GTR coverage profile
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PROFILE: ${{ steps.go_test_report.outputs.coverage_profile }}
        run: |-
          cp "$PROFILE" coverage.out
      - name: Upload read-only PR quality evidence
        if: "always() && steps.report_cleanup.outcome == 'success' && ((github.event_name == 'pull_request'))"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-go-quality-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
    permissions:
      contents: read
  containers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build container test context
        run: |
          mkdir -p "${RUNNER_TEMP}/webhook-container"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags '-w -s -X github.com/soulteary/webhook/internal/version.Version=ci-test' \
            -o "${RUNNER_TEMP}/webhook-container/webhook" .

      - name: Build all runtime variants
        run: |
          for variant in core runner extended; do
            docker build \
              --file "docker/goreleaser/Dockerfile.${variant}" \
              --tag "webhook:${variant}-test" \
              "${RUNNER_TEMP}/webhook-container"
          done

      - name: Verify runtime boundaries
        run: |
          for variant in core runner extended; do
            test "$(docker image inspect --format '{{ .Config.User }}' "webhook:${variant}-test")" = "65532:65532"
            docker run --rm "webhook:${variant}-test" -version | grep 'ci-test'
          done

          if docker run --rm --entrypoint /bin/sh webhook:core-test -c true; then
            echo 'core image unexpectedly contains a shell' >&2
            exit 1
          fi

          docker run --rm --entrypoint /bin/sh webhook:runner-test -c 'test "$(id -u)" = 65532'
          docker run --rm --entrypoint /bin/bash webhook:runner-test -c 'test "$(id -u)" = 65532'

          for tool in curl jq yq; do
            docker run --rm --entrypoint "/usr/bin/${tool}" "webhook:extended-test" --version
          done

      - name: Smoke test the secure quickstart
        env:
          WEBHOOK_IMAGE: webhook:runner-test
        run: |
          cleanup() {
            docker compose -f example/quickstart/compose.yaml down --volumes
          }
          trap cleanup EXIT

          docker compose -f example/quickstart/compose.yaml up -d --wait
          test "$(curl --fail-with-body http://127.0.0.1:9000/hooks/hello \
            -H 'Content-Type: application/json' \
            -H 'X-Webhook-Signature: sha256=fc2f94757ec900bc605b39b984b3431fa13f3ea2eb7881f2861c1c747d9ffdbd' \
            --data-binary '{"message":"hello from webhook"}')" = accepted

  redis-compatibility:
    name: Real Redis kit compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis@sha256:6a12a187547eb2eac4da4528f9d9787d69f3848e513480baedfd75e3b2ac393e
        ports:
          - '127.0.0.1:6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Check shared quotas and legacy connection configuration
        env:
          GOTOOLCHAIN: local
          WEBHOOK_REDIS_TEST_ADDR: 127.0.0.1:6379
          WEBHOOK_REDIS_TEST_REQUIRED: '1'
        run: go test -mod=readonly -race -count=1 -run '^TestRedisRateLimitCompatibility$' ./internal/middleware
