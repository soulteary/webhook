name: Tests

on:
  workflow_dispatch:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: go test -race ./...

        if: "!(github.event_name == 'pull_request')"
      - name: Remove stale generated report evidence
        if: always() && (github.event_name == 'pull_request')
        shell: bash
        run: |
          set -euo pipefail
          test ! -L .github
          rm -f -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
          rm -rf -- .github/test-results
      - name: Test, race and coverage (GTR v1.1.2)
        id: go_test_report
        uses: soulteary/go-test-report-action@bf04b539f7bf2a6f67d602da4259904b3dcdeba1  # v1.1.2
        with:
          directory: "."
          packages: "./..."
          race: "true"
          coverage_threshold: "0"
          test_args: "-count=1"
          version: "v1.1.2"
          cover_mode: "atomic"
          commit: "false"
        if: github.event_name == 'pull_request'
      - name: Go quality report (v1.1.3)
        id: go_report_card
        uses: soulteary/goreportcard-action@fc43049a5fe61c3313294d217c2a783f375a7970  # v1.1.3
        with:
          directory: "."
          version: "v1.1.3"
          threshold: "0"
          report: "true"
          commit: "false"
        if: always() && github.event_name == 'pull_request'
      - name: Reuse GTR coverage profile
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PROFILE: ${{ steps.go_test_report.outputs.coverage_profile }}
        run: |-
          cp "$PROFILE" coverage.out
      - name: Upload read-only PR quality evidence
        if: always() && (github.event_name == 'pull_request')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-go-quality-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
    permissions:
      contents: read
  containers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Build container test context
        run: |
          mkdir -p "${RUNNER_TEMP}/webhook-container"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags '-w -s -X github.com/soulteary/webhook/internal/version.Version=ci-test' \
            -o "${RUNNER_TEMP}/webhook-container/webhook" .

      - name: Build all runtime variants
        run: |
          for variant in core runner extended; do
            docker build \
              --file "docker/goreleaser/Dockerfile.${variant}" \
              --tag "webhook:${variant}-test" \
              "${RUNNER_TEMP}/webhook-container"
          done

      - name: Verify runtime boundaries
        run: |
          for variant in core runner extended; do
            test "$(docker image inspect --format '{{ .Config.User }}' "webhook:${variant}-test")" = "65532:65532"
            docker run --rm "webhook:${variant}-test" -version | grep 'ci-test'
          done

          if docker run --rm --entrypoint /bin/sh webhook:core-test -c true; then
            echo 'core image unexpectedly contains a shell' >&2
            exit 1
          fi

          docker run --rm --entrypoint /bin/sh webhook:runner-test -c 'test "$(id -u)" = 65532'
          docker run --rm --entrypoint /bin/bash webhook:runner-test -c 'test "$(id -u)" = 65532'

          for tool in curl jq yq; do
            docker run --rm --entrypoint "/usr/bin/${tool}" "webhook:extended-test" --version
          done

      - name: Smoke test the secure quickstart
        env:
          WEBHOOK_IMAGE: webhook:runner-test
        run: |
          cleanup() {
            docker compose -f example/quickstart/compose.yaml down --volumes
          }
          trap cleanup EXIT

          docker compose -f example/quickstart/compose.yaml up -d --wait
          test "$(curl --fail-with-body http://127.0.0.1:9000/hooks/hello \
            -H 'Content-Type: application/json' \
            -H 'X-Webhook-Signature: sha256=fc2f94757ec900bc605b39b984b3431fa13f3ea2eb7881f2861c1c747d9ffdbd' \
            --data-binary '{"message":"hello from webhook"}')" = accepted
