name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/benchmark.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/benchmark.yml"

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Record environment
        run: |
          {
            go version
            git rev-parse HEAD
            uname -a
            lscpu
          } | tee benchmark-environment.txt

      - name: Run reproducible benchmark sample
        run: |
          go test -run='^$' \
            -bench='Benchmark(HookExecution|ConcurrentHookExecution)$' \
            -benchmem -count=5 ./internal/server | tee benchmark.txt
          {
            echo '## Hook execution benchmarks'
            echo '```text'
            cat benchmark.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ github.sha }}
          path: |
            benchmark.txt
            benchmark-environment.txt
          if-no-files-found: error
